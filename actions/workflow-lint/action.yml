# Lint GitHub Actions workflows, composite actions and Dependabot
# configuration: actionlint (syntax, expressions, shellcheck of run: blocks)
# and zizmor (security: template injection, credential persistence, unpinned
# actions and images, excessive permissions). Findings fail the step and are
# annotated on the pull request; nothing is uploaded to code scanning.
#
# Needs a checkout of the repository without persisted credentials:
#
#   workflow-lint:
#     name: Workflow lint
#     runs-on: ubuntu-24.04
#     timeout-minutes: 10
#     steps:
#       - uses: actions/checkout@<commit sha> # <tag>
#         with:
#           persist-credentials: false
#       - uses: porthole-dev/.github/actions/workflow-lint@<commit sha> # <tag>
#
# Tool versions are pinned here, for every repository at once. Dependabot
# keeps zizmor-action current; the actionlint image digest is bumped by hand.
name: Workflow lint
description: Run actionlint and zizmor on the repository's workflows
runs:
  using: composite
  steps:
    - name: actionlint
      shell: sh
      env:
        IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # One error annotation per finding, on the line it is about.
      run: >-
        docker run --rm -v "$PWD:/repo:ro" -w /repo "$IMAGE" -color=false
        -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
    - name: zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        version: 1.30.1
        advanced-security: false
        persona: regular
