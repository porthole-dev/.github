name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, package version or commit you used.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      description: For example "Google Pixel 2 XL, postmarketOS edge, phosh".
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove IP and MAC addresses, network names, serial numbers and personal paths first.
      render: text
