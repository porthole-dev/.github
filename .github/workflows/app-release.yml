# Release an application from a pushed version tag, for the organization's app
# repositories (obscura, tap, phosh-nfc-quick-setting):
#
#   1. create the GitHub release, with notes from the commits since the
#      previous tag, the source archive as an asset and its SHA512SUMS;
#   2. attest the archive's build provenance (public repositories only:
#      artifact attestations in private repositories need GitHub Enterprise
#      Cloud);
#   3. open or update a pull request in porthole-dev/pmaports that moves the
#      app's aport to the new version and archive checksum.
#
# Step 3 needs the PMAPORTS_TOKEN secret: a fine-grained token with owner
# porthole-dev, access to the pmaports repository only, and read and write
# permission for Contents and Pull requests. Without it the step is skipped
# with a warning; the release is still created.
#
# A dry run (the default of the callers' manual runs) publishes and pushes
# nothing; it prints the notes, the checksum and, with the token, the aport
# change.
#
# Caller, .github/workflows/release.yml:
#
#   on:
#     push:
#       tags: ["v*"]
#     workflow_dispatch:
#       inputs:
#         tag: {description: Existing tag to release, type: string, required: true}
#         dry-run: {description: Only show what would be released, type: boolean, default: true}
#   permissions: {}
#   concurrency: {group: release, cancel-in-progress: false}
#   jobs:
#     release:
#       name: Release
#       permissions:
#         contents: write          # create the release
#         id-token: write          # sign the attestation
#         attestations: write      # store the attestation
#         artifact-metadata: write # record the attested artifact
#       uses: porthole-dev/.github/.github/workflows/app-release.yml@<commit sha> # <tag>
#       with:
#         aport: testing/obscura
#         tag: ${{ inputs.tag || github.ref_name }}
#         dry-run: ${{ inputs.dry-run || false }}
#       secrets:
#         PMAPORTS_TOKEN: ${{ secrets.PMAPORTS_TOKEN }}
name: App release

on:
  workflow_call:
    inputs:
      aport:
        description: The app's aport in pmaports, for example testing/obscura
        type: string
        required: true
      tag:
        description: The tag to release, for example v0.2.0
        type: string
        required: true
      dry-run:
        description: Only show what would be released
        type: boolean
        default: false
    secrets:
      PMAPORTS_TOKEN:
        required: false

permissions: {}

env:
  PMAPORTS: porthole-dev/pmaports
  PMAPORTS_BRANCH: taimen-bringup
  APORT: ${{ inputs.aport }}
  TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry-run }}

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
      artifact-metadata: write # record the attested artifact
    outputs:
      version: ${{ steps.archive.outputs.version }}
      sha512: ${{ steps.archive.outputs.sha512 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag being released, with the history and the other tags the
          # notes are written from. A manual run for an existing tag gets
          # exactly what a tag push gets; without fetch-tags it saw none.
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      - name: Write the release notes
        run: |
          set -eu
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null ||
            { echo "::error::No tag $TAG"; exit 1; }
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null); then
            echo "## Changes since $previous" > "$RUNNER_TEMP/notes.md"
            range=$previous..$TAG
          else
            echo "## Changes" > "$RUNNER_TEMP/notes.md"
            range=$TAG
          fi
          {
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "The source archive's provenance, where attested, is verified with"
            echo "\`gh attestation verify <archive> -R $GITHUB_REPOSITORY\`."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - id: archive
        name: Download and checksum the source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The archive abuild downloads from
          # https://github.com/<repository>/archive/refs/tags/<tag>.tar.gz,
          # which redirects to codeload. github.com does not accept this job's
          # token for a private repository; codeload does, and serves the same bytes.
          name=${GITHUB_REPOSITORY#*/}
          version=${TAG#v}
          mkdir -p "$RUNNER_TEMP/assets"
          archive=$RUNNER_TEMP/assets/$name-$version.tar.gz
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o "$archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/refs/tags/$TAG"
          top=$(tar -tzf "$archive" | head -n1)
          [ "$top" = "$name-$version/" ] || { echo "::error::Unexpected archive layout: $top"; exit 1; }
          (cd "$RUNNER_TEMP/assets" && sha512sum "$name-$version.tar.gz" > SHA512SUMS && cat SHA512SUMS)
          {
            echo "version=$version"
            echo "sha512=$(cut -d' ' -f1 "$RUNNER_TEMP/assets/SHA512SUMS")"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the source archive
        if: ${{ !inputs.dry-run && github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}
      - name: Say why the archive is not attested
        if: ${{ !inputs.dry-run && github.event.repository.visibility != 'public' }}
        run: echo "::notice::The source archive is not attested while $GITHUB_REPOSITORY is private (artifact attestations need a public repository on this plan)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; left unchanged"
          elif [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: release $TAG not created"
          else
            case "$TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "$TAG" --verify-tag $prerelease \
              --title "${GITHUB_REPOSITORY#*/} ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" \
              "$RUNNER_TEMP"/assets/*
          fi

  pmaports:
    name: Update the pmaports aport
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - id: check
        name: Check the tag and the token
        env:
          PMAPORTS_TOKEN: ${{ secrets.PMAPORTS_TOKEN }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -qxE 'v[0-9]+(\.[0-9]+)*'; then
            echo "::notice::$TAG is not a plain version tag (vX.Y.Z); the aport is not updated"
            exit 0
          fi
          if [ -n "$PMAPORTS_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PMAPORTS_TOKEN is not set: $APORT in $PMAPORTS is not moved to $TAG"
          fi
      - name: Open or update the pull request
        if: steps.check.outputs.token
        env:
          GH_TOKEN: ${{ secrets.PMAPORTS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA512: ${{ needs.release.outputs.sha512 }}
        run: |
          set -eu
          gh auth setup-git
          git clone -q --depth 1 --filter=blob:none --sparse --branch "$PMAPORTS_BRANCH" \
            "https://github.com/$PMAPORTS.git" "$RUNNER_TEMP/pmaports"
          cd "$RUNNER_TEMP/pmaports"
          git sparse-checkout set "$APORT"
          apkbuild=$APORT/APKBUILD

          # Point the aport at VERSION and SHA512: pkgrel 0 for a new version,
          # one higher for the same version (a re-tagged release).
          value() { sed -n "s/^$1=//p" "$apkbuild" | head -n1; }
          pkgname=$(value pkgname) pkgver=$(value pkgver) pkgrel=$(value pkgrel)
          old="$pkgname-$pkgver.tar.gz"
          [ "$(grep -cE "^[0-9a-f]{128}  $old\$" "$apkbuild")" = 1 ] ||
            { echo "::error::$apkbuild has no single checksum line for $old"; exit 1; }
          if [ "$pkgver" = "$VERSION" ]; then
            if grep -qxF "$SHA512  $old" "$apkbuild"; then
              echo "::notice::$APORT on $PMAPORTS_BRANCH is already at $TAG"
              exit 0
            fi
            pkgrel=$((pkgrel + 1))
            subject="update the $VERSION source archive"
          else
            pkgrel=0
            subject="upgrade to $VERSION"
          fi
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=$pkgrel/" \
            -e "s/^[0-9a-f]\{128\}  $old\$/$SHA512  $pkgname-$VERSION.tar.gz/" \
            "$apkbuild"
          git diff --exit-code >/dev/null && { echo "::error::$apkbuild did not change"; exit 1; }
          git diff

          # The aport's maintainer authors the change and signs it off before merge.
          maintainer=$(sed -n 's/^maintainer="\(.*\)"$/\1/p' "$apkbuild")
          git -c user.name="${maintainer% <*}" -c user.email="$(echo "${maintainer##*<}" | tr -d '>')" \
            commit -q -a -F - <<EOF
          $APORT: $subject

          Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG
          EOF
          branch=release/${GITHUB_REPOSITORY#*/}
          if [ "$DRY_RUN" = true ]; then
            git show --stat HEAD
            echo "::notice::Dry run: $branch not pushed and no pull request opened"
            exit 0
          fi
          git push -q --force origin "HEAD:refs/heads/$branch"
          body="Moves \`$APORT\` to [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG), opened by the release workflow of $GITHUB_REPOSITORY. The checksum is that of the tag's source archive (SHA512SUMS in the release). Sign off before merging."
          number=$(gh pr list -R "$PMAPORTS" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$PMAPORTS" --title "$APORT: $subject" --body "$body"
          else
            gh pr create -R "$PMAPORTS" --base "$PMAPORTS_BRANCH" --head "$branch" \
              --title "$APORT: $subject" --body "$body"
          fi
